<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher của tôi - Nexus Sinh Viên</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .voucher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .voucher-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            transition: transform 0.3s;
            border-left: 6px solid #38a169;
        }

            .voucher-card.used {
                border-left-color: #ccc;
                opacity: 0.6;
            }

            .voucher-card.expired {
                border-left-color: #c53030;
                opacity: 0.5;
            }

            .voucher-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            }

        .voucher-header {
            padding: 20px 20px 15px;
            border-bottom: 2px dashed #f0f0f0;
            position: relative;
        }

            .voucher-header .ten {
                font-size: 18px;
                font-weight: bold;
                color: #333;
                margin-bottom: 5px;
                padding-right: 40px;
            }

            .voucher-header .co-so {
                color: #888;
                font-size: 14px;
            }

        .voucher-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .voucher-body {
            padding: 20px;
            text-align: center;
        }

        .ma-code {
            background: #f8f9ff;
            border: 2px dashed #667eea;
            padding: 15px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

            .ma-code:hover {
                background: #eef1ff;
            }

            .ma-code .copy-hint {
                position: absolute;
                top: 5px;
                right: 10px;
                font-size: 11px;
                color: #888;
                letter-spacing: 0;
                font-family: 'Segoe UI', sans-serif;
                font-weight: normal;
            }

        /* QR Code */
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #fafbff;
            border-radius: 12px;
            border: 2px dashed #cbd5e0;
        }

            .qr-wrapper img {
                width: 160px;
                height: 160px;
                border-radius: 8px;
                background: white;
                padding: 5px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            }

            .qr-wrapper .qr-hint {
                font-size: 12px;
                color: #888;
                margin-top: 8px;
                text-align: center;
            }

        .trang-thai {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

            .trang-thai.chua_dung {
                background: #c6f6d5;
                color: #2f855a;
            }

            .trang-thai.da_dung {
                background: #e2e8f0;
                color: #4a5568;
            }

            .trang-thai.het_han {
                background: #fed7d7;
                color: #c53030;
            }

        .voucher-footer {
            padding: 12px 20px;
            background: #fafafa;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

            .empty-state .icon {
                font-size: 80px;
                margin-bottom: 20px;
            }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            overflow-x: auto;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
            white-space: nowrap;
        }

            .tab.active {
                color: #667eea;
                border-bottom-color: #667eea;
            }

        /* Toast thông báo copy */
        .toast-copy {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #38a169;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo"><h1>🎓 Nexus Sinh Viên</h1></div>
            <nav class="nav" id="mainNav">
                <!-- Menu render động bằng JS -->
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2 class="section-title">🎟️ Voucher của tôi</h2>

            <div class="tabs">
                <div class="tab active" onclick="locVoucher('all', this)">Tất cả</div>
                <div class="tab" onclick="locVoucher('chua_dung', this)">✅ Chưa dùng</div>
                <div class="tab" onclick="locVoucher('da_dung', this)">✓ Đã dùng</div>
                <div class="tab" onclick="locVoucher('het_han', this)">⛔ Hết hạn</div>
            </div>

            <div class="voucher-grid" id="voucherGrid">
                <p class="loading">Đang tải...</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container"><p>© 2026 Nexus Sinh Viên</p></div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        let tatCaVoucher = [];
        let filterHienTai = 'all';

        // =====================================================
        // MENU ĐỘNG THEO VAI TRÒ
        // =====================================================
        function capNhatMenuTheoVaiTro() {
            const user = Auth.layNguoiDung();
            const nav = document.getElementById('mainNav');
            if (!nav) return;

            let menuHtml = `
                    <a href="index.html">Trang chủ</a>
                    <a href="tim-kiem.html">Tìm kiếm</a>
                    <a href="uu-dai.html">Ưu đãi</a>
                `;

            if (user) {
                const loai = user.loaiNguoiDung;

                // Đối tác (CSKD + Admin) thấy "Quản lý cơ sở"
                if (loai === 'co_so_kinh_doanh' || loai === 'quan_tri') {
                    menuHtml += `<a href="quan-ly-co-so.html">🏪 Quản lý</a>`;
                }

                // Chỉ Admin thấy "Quản trị" + "Thống kê"
                if (loai === 'quan_tri') {
                    menuHtml += `<a href="quan-tri.html">👑 Quản trị</a>`;
                    menuHtml += `<a href="thong-ke.html">📈 Thống kê</a>`;
                }

                menuHtml += `<a href="ca-nhan.html" id="btnDangNhap">👤 ${user.hoTen}</a>`;
            } else {
                menuHtml += `<a href="dang-nhap.html" id="btnDangNhap">Đăng nhập</a>`;
            }

            nav.innerHTML = menuHtml;
        }

        // =====================================================
        // KHỞI TẠO KHI LOAD TRANG
        // =====================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // ✅ Dùng phương thức phân quyền mới
            if (!Auth.yeuCauDangNhap()) return;

            capNhatMenuTheoVaiTro();
            await taiVoucher();
        });

        // =====================================================
        // TẢI VOUCHER
        // =====================================================
        async function taiVoucher() {
            const ds = await API.layPhieuGiamGia();
            const grid = document.getElementById('voucherGrid');

            if (!ds || ds.error || ds.length === 0) {
                grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <div class="icon">🎟️</div>
                            <p>Bạn chưa có voucher nào</p>
                            <p style="margin-top: 10px;">
                                <a href="uu-dai.html" style="color: #667eea; font-weight: 600;">
                                    Đổi điểm lấy voucher ngay →
                                </a>
                            </p>
                        </div>
                    `;
                return;
            }

            tatCaVoucher = ds;
            hienThiVoucher();
        }

        // =====================================================
        // HIỂN THỊ VOUCHER
        // =====================================================
        function hienThiVoucher() {
            const grid = document.getElementById('voucherGrid');
            const ds = filterHienTai === 'all'
                ? tatCaVoucher
                : tatCaVoucher.filter(v => v.trangThai === filterHienTai);

            if (ds.length === 0) {
                grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <div class="icon">📭</div>
                            <p>Không có voucher nào trong mục này</p>
                        </div>
                    `;
                return;
            }

            grid.innerHTML = ds.map(v => {
                const ngayHetHan = new Date(v.ngayHetHan);
                const conLai = Math.ceil((ngayHetHan - new Date()) / (1000 * 60 * 60 * 24));

                let tenTrangThai = '';
                if (v.trangThai === 'chua_dung') tenTrangThai = '✅ Chưa dùng';
                else if (v.trangThai === 'da_dung') tenTrangThai = '✓ Đã dùng';
                else tenTrangThai = '⛔ Hết hạn';

                // Chỉ hiển thị QR khi voucher chưa dùng và còn hạn
                const hienThiQR = v.trangThai === 'chua_dung' && conLai > 0;

                // URL QR - dùng api.qrserver.com (miễn phí, không cần đăng ký)
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(v.maCode)}&bgcolor=ffffff&color=667eea`;

                return `
                        <div class="voucher-card ${v.trangThai}">
                            <div class="voucher-header">
                                <div class="ten">${v.tenUuDai}</div>
                                <div class="co-so">🏪 ${v.tenCoSo}</div>
                            </div>
                            <div class="voucher-body">
                                <div class="ma-code" onclick="copyMa('${v.maCode}')">
                                    <span class="copy-hint">📋 Nhấn để copy</span>
                                    ${v.maCode}
                                </div>

                                ${hienThiQR ? `
                                    <div class="qr-wrapper">
                                        <img src="${qrUrl}" alt="QR Code" loading="lazy">
                                        <div class="qr-hint">
                                            📱 Quét mã QR tại cơ sở để sử dụng
                                        </div>
                                    </div>
                                ` : ''}

                                <span class="trang-thai ${v.trangThai}">${tenTrangThai}</span>
                            </div>
                            <div class="voucher-footer">
                                <span>📅 HSD: ${ngayHetHan.toLocaleDateString('vi-VN')}</span>
                                <span>${conLai > 0 ? `⏰ Còn ${conLai} ngày` : 'Đã hết hạn'}</span>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        // =====================================================
        // LỌC VOUCHER
        // =====================================================
        function locVoucher(loai, el) {
            filterHienTai = loai;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            hienThiVoucher();
        }

        // =====================================================
        // COPY MÃ VOUCHER
        // =====================================================
        function copyMa(maCode) {
            navigator.clipboard.writeText(maCode).then(() => {
                hienThiToast(`📋 Đã copy mã: ${maCode}`);
            }).catch(() => {
                // Fallback cho trình duyệt cũ
                const textArea = document.createElement('textarea');
                textArea.value = maCode;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                hienThiToast(`📋 Đã copy mã: ${maCode}`);
            });
        }

        // =====================================================
        // HIỂN THỊ TOAST
        // =====================================================
        function hienThiToast(message) {
            // Xóa toast cũ nếu có
            const toastCu = document.querySelector('.toast-copy');
            if (toastCu) toastCu.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-copy';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
