<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ưu đãi - Uni-Link</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .uu-dai-full-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .uu-dai-card-full {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            position: relative;
        }

            .uu-dai-card-full:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            }

        .uu-dai-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            position: relative;
        }

            .uu-dai-header .badge {
                position: absolute;
                top: 15px;
                right: 15px;
                background: #ff6b6b;
                padding: 5px 12px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: bold;
            }

            .uu-dai-header h3 {
                font-size: 20px;
                margin-bottom: 5px;
                padding-right: 60px;
            }

            .uu-dai-header .ten-co-so {
                font-size: 13px;
                opacity: 0.9;
            }

        .uu-dai-body {
            padding: 20px;
        }

            .uu-dai-body p {
                color: #666;
                font-size: 14px;
                margin-bottom: 15px;
                min-height: 40px;
            }

        .uu-dai-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

            .uu-dai-info .gia-tri {
                color: #ff6b6b;
                font-weight: bold;
                font-size: 18px;
            }

            .uu-dai-info .so-luong {
                color: #888;
                font-size: 13px;
            }

        .btn-doi-diem {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

            .btn-doi-diem:hover {
                transform: translateY(-2px);
            }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

            .empty-state .icon {
                font-size: 80px;
                margin-bottom: 20px;
            }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo"><h1>🎓 Uni-Link</h1></div>
            <nav class="nav">
                <a href="index.html">Trang chủ</a>
                <a href="tim-kiem.html">Tìm kiếm</a>
                <a href="uu-dai.html">Ưu đãi</a>
                <a href="dang-nhap.html" id="btnDangNhap">Đăng nhập</a>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2 class="section-title">🎁 Tất cả ưu đãi</h2>
            <p style="color: #666; margin-bottom: 20px;" id="diemCuaBan"></p>
            <div class="uu-dai-full-grid" id="uuDaiGrid">
                <p class="loading">Đang tải...</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container"><p>© 2026 Uni-Link</p></div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        let nguoiDungHienTai = null;

        document.addEventListener('DOMContentLoaded', async () => {
            capNhatNavbar();

            // Lấy thông tin người dùng nếu đã đăng nhập
            if (Auth.daDangNhap()) {
                nguoiDungHienTai = await API.thongTinCaNhan();
                if (nguoiDungHienTai && !nguoiDungHienTai.error) {
                    document.getElementById('diemCuaBan').innerHTML =
                        `💰 Bạn có <strong style="color: #667eea;">${nguoiDungHienTai.diemTichLuy || 0} điểm</strong>`;
                }
            } else {
                document.getElementById('diemCuaBan').innerHTML =
                    `Vui lòng <a href="dang-nhap.html" style="color: #667eea; font-weight: 600;">đăng nhập</a> để đổi điểm lấy voucher`;
            }

            await taiUuDai();
        });

        async function taiUuDai() {
            const grid = document.getElementById('uuDaiGrid');
            const ds = await API.layUuDai();

            if (!ds || ds.error || ds.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">🎁</div>
                        <p>Chưa có ưu đãi nào</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = ds.map(ud => {
                let giam = '';
                if (ud.loaiGiamGia === 'phan_tram') giam = `-${ud.giaTriGiam}%`;
                else if (ud.loaiGiamGia === 'so_tien') giam = `-${formatGia(ud.giaTriGiam)}`;
                else giam = 'Qùa tặng';

                return `
                    <div class="uu-dai-card-full">
                        <div class="uu-dai-header">
                            <span class="badge">${giam}</span>
                            <h3>${ud.tieuDe}</h3>
                            <div class="ten-co-so">🏪 ${ud.coSo?.tenCoSo || 'N/A'}</div>
                        </div>
                        <div class="uu-dai-body">
                            <p>${ud.moTa || ''}</p>
                            <div class="uu-dai-info">
                                <span class="gia-tri">${giam}</span>
                                <span class="so-luong">Còn ${ud.soLuong - ud.soLuongDaDung} lượt</span>
                            </div>
                            <button class="btn-doi-diem" onclick="doiDiem(${ud.maUuDai})">
                                Đổi 100 điểm lấy voucher
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function doiDiem(maUuDai) {
            if (!Auth.daDangNhap()) {
                alert('Vui lòng đăng nhập để đổi điểm');
                window.location.href = 'dang-nhap.html';
                return;
            }

            if (!nguoiDungHienTai || (nguoiDungHienTai.diemTichLuy || 0) < 100) {
                alert('Bạn cần ít nhất 100 điểm để đổi voucher');
                return;
            }

            if (!confirm('Đổi 100 điểm lấy voucher này?')) return;

            const kq = await goiAPI('/phieu-giam-gia/doi-diem', 'POST', {
                maUuDai: maUuDai,
                soDiem: 100
            });

            if (kq.error) {
                alert(kq.message || 'Đổi điểm thất bại');
                return;
            }

            alert(`✅ ${kq.message}\n📌 Mã voucher: ${kq.maCode}\n💰 Điểm còn lại: ${kq.diemConLai}`);
            location.reload();
        }
    </script>
</body>
</html>
